  /properties/auto-complete-v2:
    get:
      summary: "properties/auto-complete-v2"
      tags:
        - Property search
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            example: "Houston"
          description: |
            - Required: true
            - Ex: `Houston`
        - name: limit
          in: query
          schema:
            type: number
            example: 25
            default: 10
          description: |
            - Total number of record per api call
            - Ex: `25`
            - Default: `10`
        - name: searchContext
          in: query
          schema:
            type: string
            enum: [FOR_SALE, FOR_RENT, SOLD]
            default: "FOR_SALE"
          description: |
            - Search context
            - Choose one of the values below
            - Default: `FOR_SALE`
            - `FOR_SALE`
            - `FOR_RENT`
            - `SOLD`
        - name: resultType
          in: query
          schema:
            type: string
          description: |
            - Result type
            - It can input multiple values, and the values should be separated by commas
            - Ex: `ADDRESSES,FORSALE`
