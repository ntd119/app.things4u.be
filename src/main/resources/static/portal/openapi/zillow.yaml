                            "streetViewLink": "https://maps.googleapis.com/maps/api/streetview?size=1600x240&location=29.814409255981445,-95.39679718017578&key=AIzaSyBJsNQO5ZeG-XAbqqWLKwG08fWITSxg33w&signature=kJ_jKMBnwtEz-9OiuiWsT9AYl1M=",
                            "satelliteLink": "https://maps.googleapis.com/maps/api/staticmap?mobile=false&sensor=true&maptype=satellite&size=1600x480&zoom=19&center=29.814409255981445,-95.39679718017578&key=AIzaSyBJsNQO5ZeG-XAbqqWLKwG08fWITSxg33w&signature=P_M_XvVJwjjF5OVwR6MoeVQvF7U=",
                            "streetViewMetadataLink": "https://maps.googleapis.com/maps/api/streetview/metadata?location=29.814409255981445,-95.39679718017578&key=AIzaSyBJsNQO5ZeG-XAbqqWLKwG08fWITSxg33w&signature=pgUkFsoSZYi2F3UabpVYwLSiovw="
                          },
