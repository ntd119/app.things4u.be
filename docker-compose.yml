version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: apinexo-postgres
    restart: always
    environment:
      POSTGRES_DB: apinexo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  apinexo:
    build: .
    container_name: apinexo-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    restart: always

volumes:
  postgres_data:
