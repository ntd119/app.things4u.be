version: "3.8"

services:
  blue:
    image: myapp:latest
    container_name: app-blue
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod

  green:
    image: myapp:latest
    container_name: app-green
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=prod